name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Compile
        run: npm run compile

      # Replays the golden transcripts in test/golden through the parsers.
      # No probe, no hardware — this is the fast tier that gates every push.
      # The hardware tier (hil.yml) runs separately on the self-hosted runner.
      - name: Unit tests
        run: npm test
